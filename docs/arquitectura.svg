<text x="666" y="205" class="l" font-size="14">filtro de eventos: ignora historico</text>
<text x="666" y="224" class="l" font-size="14">EWMA + z-score propio y por pares</text>
<text x="666" y="243" class="l" font-size="14">score, severidad, causa común</text>
