<text x="66" y="466" class="l" font-size="14">/panel: máquinas, incidentes y</text>
<text x="66" y="485" class="l" font-size="14">técnicos en 1 llamada cada 15 s</text>
<text x="66" y="504" class="l" font-size="14">detalle, telemetría, flota</text>
<text x="66" y="523" class="l" font-size="14">bandeja, atender y cerrar</text>
<text x="66" y="542" class="l" font-size="14">cierre: historial + recurrencia</text>
<text x="66" y="561" class="l" font-size="14">fachadas: asistente, demo/falla</text>
