<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs>
  <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a30"/></marker>
  <marker id="puntaRosa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7246A"/></marker>
  <style>
    text { font-family: Barlow, 'Segoe UI', Arial, sans-serif; fill: #1e2a30; }
    .h { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 32px; font-weight: 700; }
    .s { font-size: 16px; fill: #4a5960; }
    .r { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 19px; font-weight: 700; }
    .t { font-size: 16px; font-weight: 600; }
    .l { fill: #4a5960; }
    .p { font-size: 13.5px; font-weight: 500; }
