<text x="40" y="50" class="h">ArquiFusion: mantenimiento inteligente de flota, 100 % serverless en AWS + Google Cloud</text>
<text x="40" y="78" class="s">Nada queda encendido y nunca corren 10 Lambdas a la vez (pico medido con 8 incidentes simultáneos: 4). Las flechas siguen el camino de una lectura.</text>
<rect x="20" y="96" width="1760" height="668" rx="10" fill="#E07B00" fill-opacity=".06" stroke="#E07B00" stroke-width="2"/>
