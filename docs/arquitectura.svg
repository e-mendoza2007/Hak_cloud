<text x="356" y="606" class="l" font-size="14">técnico, supervisor, gerente</text>
<text x="356" y="625" class="l" font-size="14">Step Functions publica directo</text>
<text x="356" y="644" class="l" font-size="14">(sin Lambda); el correo depende</text>
<text x="356" y="663" class="l" font-size="14">de la severidad</text>
