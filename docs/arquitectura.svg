<text x="1036" y="355" class="l" font-size="14">reservar: almacén más cercano</text>
<text x="1036" y="374" class="l" font-size="14">notificar: 4 roles en 1 invocación</text>
<text x="1036" y="393" class="l" font-size="14">escalar: supervisor y luego gerente</text>
