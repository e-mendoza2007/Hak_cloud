# FlujoIncidente (Standard). Lo inicia el detector de A (datos-ia) con el ARN guardado en SSM
# /arquifusion/sfn_incidente_arn. Entrada: {incidente_id, maquina_id, zona, severidad, score}.
# La severidad se lee de DynamoDB (el detector la sigue subiendo después de crear el incidente).
#
# Regla de la hackathon: menos de 10 Lambdas a la vez. Por eso:
#  - las tareas de B van en secuencia y todas usan la Lambda "operaciones" (tope de concurrencia 1);
#  - los correos por rol salen con un Parallel de sns:publish directos (sin Lambdas);
#  - si el tope frena una tarea (Lambda.TooManyRequestsException), se reintenta con espera aleatoria.
# Nota: la definición no usa valores null porque CloudFormation los descarta del ASL.
Comment: ArquiFusion - gestión automática de un incidente (Persona B)
StartAt: LeerIncidente
States:

  LeerIncidente:
    Type: Task
    Comment: Integración directa con DynamoDB (sin Lambda)
    Resource: arn:aws:states:::dynamodb:getItem
    Parameters:
      TableName: af_incidentes
      Key:
        incidente_id:
          S.$: $.incidente_id
    ResultSelector:
      estado.$: $.Item.estado.S
      severidad.$: $.Item.severidad.S
    ResultPath: $.actual
    Retry:
      - ErrorEquals: [States.TaskFailed]
        IntervalSeconds: 2
        MaxAttempts: 2
        BackoffRate: 2
    Catch:
      - ErrorEquals: [States.ALL]
        ResultPath: $.error
        Next: AvisarFallo
    Next: YaResuelto

  YaResuelto:
    Type: Choice
    Choices:
      - Variable: $.actual.estado
        StringEquals: resuelto
        Next: Atendido
    Default: ClasificarSeveridad

  ClasificarSeveridad:
    Type: Choice
    Comment: La severidad define el SLA (y quién recibe correo se decide al preparar las notificaciones)
    Choices:
      - Variable: $.actual.severidad
        StringEquals: critica
        Next: RutaCritica
      - Variable: $.actual.severidad
        StringEquals: alta
        Next: RutaAlta
    Default: RutaMedia

  RutaCritica:
    Type: Pass
    Result:
      ruta: critica
      sla_seg: ${self:custom.slaSeg.critica}
      nivel: 0
    ResultPath: $.control
    Next: ExplicarConIA

  RutaAlta:
    Type: Pass
    Result:
      ruta: alta
      sla_seg: ${self:custom.slaSeg.alta}
      nivel: 0
    ResultPath: $.control
    Next: ExplicarConIA

  RutaMedia:
    Type: Pass
    Result:
      ruta: media
      sla_seg: ${self:custom.slaSeg.media}
      nivel: 0
    ResultPath: $.control
    Next: ExplicarConIA

  ExplicarConIA:
    Type: Task
    Comment: Lambda de A (Gemini, o plantilla si falla). Si la Lambda falla, el flujo sigue sin IA.
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: ${self:custom.lambdaA}-iaExplicar
      Payload:
        incidente_id.$: $.incidente_id
    ResultSelector:
      fuente.$: $.Payload.ia.fuente
    ResultPath: $.ia
    TimeoutSeconds: 60
    Retry:
      - ErrorEquals: [Lambda.TooManyRequestsException]
        IntervalSeconds: 2
        MaxAttempts: 8
        BackoffRate: 1.5
        JitterStrategy: FULL
      - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException]
        IntervalSeconds: 2
        MaxAttempts: 2
        BackoffRate: 2
    Catch:
      - ErrorEquals: [States.ALL]
        ResultPath: $.ia
        Next: AsignarTecnico
    Next: AsignarTecnico

  AsignarTecnico:
    Type: Task
    Comment: Cercanía, especialidad y carga según severidad, con ETA (reserva atómica del técnico)
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: ${self:custom.lambdaB}-operaciones
      Payload:
        accion: asignar
        incidente_id.$: $.incidente_id
    ResultSelector:
      tecnico_id.$: $.Payload.tecnico_id
    ResultPath: $.tecnico
    Retry:
      - ErrorEquals: [Lambda.TooManyRequestsException]
        IntervalSeconds: 2
        MaxAttempts: 8
        BackoffRate: 1.5
        JitterStrategy: FULL
      - ErrorEquals: [States.ALL]
        IntervalSeconds: 2
        MaxAttempts: 2
        BackoffRate: 2
    Catch:
      - ErrorEquals: [States.ALL]
        ResultPath: $.errorAsignar
        Next: SinTecnico
    Next: ReservarRepuesto

  SinTecnico:
    Type: Pass
    Result:
      motivo: error al asignar
    ResultPath: $.tecnico
    Next: ReservarRepuesto

  ReservarRepuesto:
    Type: Task
    Comment: Descuenta el componente probable del almacén con stock más cercano
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: ${self:custom.lambdaB}-operaciones
      Payload:
        accion: reservar
        incidente_id.$: $.incidente_id
    ResultSelector:
      reservado.$: $.Payload.reservado
    ResultPath: $.repuesto
    Retry:
      - ErrorEquals: [Lambda.TooManyRequestsException]
        IntervalSeconds: 2
        MaxAttempts: 8
        BackoffRate: 1.5
        JitterStrategy: FULL
      - ErrorEquals: [States.ALL]
        IntervalSeconds: 2
        MaxAttempts: 2
        BackoffRate: 2
    Catch:
      - ErrorEquals: [States.ALL]
        ResultPath: $.errorRepuesto
        Next: SinRepuesto
    Next: PrepararNotificaciones

  SinRepuesto:
    Type: Pass
    Result:
      reservado: false
      motivo: error al reservar
    ResultPath: $.repuesto
    Next: PrepararNotificaciones

  PrepararNotificaciones:
    Type: Task
    Comment: Una sola Lambda arma el mensaje de los 4 roles y llena sus bandejas
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: ${self:custom.lambdaB}-operaciones
      Payload:
        accion: notificar
        incidente_id.$: $.incidente_id
    ResultSelector:
      correos.$: $.Payload.correos
      zona.$: $.Payload.zona
      severidad.$: $.Payload.severidad
    ResultPath: $.notif
    Retry:
      - ErrorEquals: [Lambda.TooManyRequestsException]
        IntervalSeconds: 2
        MaxAttempts: 8
        BackoffRate: 1.5
        JitterStrategy: FULL
      - ErrorEquals: [States.ALL]
        IntervalSeconds: 2
        MaxAttempts: 2
        BackoffRate: 2
    Catch:
      - ErrorEquals: [States.ALL]
        ResultPath: $.errorNotif
        Next: TieneTecnico
    Next: EnviarCorreos

  EnviarCorreos:
    Type: Parallel
    Comment: Correo a cada rol con integración directa a SNS (sin Lambdas); cada rama decide si corresponde
    ResultPath: $.correos
    Branches:
      - StartAt: DebeCorreoTecnico
        States:
          DebeCorreoTecnico:
            Type: Choice
            Choices:
              - Variable: $.notif.correos.tecnico.enviar
                BooleanEquals: true
                Next: PublicarTecnico
            Default: SinCorreoTecnico
          PublicarTecnico:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              TopicArn: arn:aws:sns:${aws:region}:${aws:accountId}:af-notif-tecnico
              Subject.$: $.notif.correos.tecnico.asunto
              Message.$: $.notif.correos.tecnico.mensaje
              MessageAttributes:
                zona:
                  DataType: String
                  StringValue.$: $.notif.zona
                severidad:
                  DataType: String
                  StringValue.$: $.notif.severidad
            ResultSelector:
              rol: tecnico
              MessageId.$: $.MessageId
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                Next: SinCorreoTecnico
            End: true
          SinCorreoTecnico:
            Type: Pass
            Result:
              rol: tecnico
              enviado: false
            End: true
      - StartAt: DebeCorreoSupervisor
        States:
          DebeCorreoSupervisor:
            Type: Choice
            Choices:
              - Variable: $.notif.correos.supervisor.enviar
                BooleanEquals: true
                Next: PublicarSupervisor
            Default: SinCorreoSupervisor
          PublicarSupervisor:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              TopicArn: arn:aws:sns:${aws:region}:${aws:accountId}:af-notif-supervisor
              Subject.$: $.notif.correos.supervisor.asunto
              Message.$: $.notif.correos.supervisor.mensaje
              MessageAttributes:
                zona:
                  DataType: String
                  StringValue.$: $.notif.zona
                severidad:
                  DataType: String
                  StringValue.$: $.notif.severidad
            ResultSelector:
              rol: supervisor
              MessageId.$: $.MessageId
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                Next: SinCorreoSupervisor
            End: true
          SinCorreoSupervisor:
            Type: Pass
            Result:
              rol: supervisor
              enviado: false
            End: true
      - StartAt: DebeCorreoGerente
        States:
          DebeCorreoGerente:
            Type: Choice
            Comment: El gerente solo recibe correo en incidentes críticos; el resto queda en su bandeja
            Choices:
              - Variable: $.notif.correos.gerente.enviar
                BooleanEquals: true
                Next: PublicarGerente
            Default: SinCorreoGerente
          PublicarGerente:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              TopicArn: arn:aws:sns:${aws:region}:${aws:accountId}:af-notif-gerente
              Subject.$: $.notif.correos.gerente.asunto
              Message.$: $.notif.correos.gerente.mensaje
              MessageAttributes:
                zona:
                  DataType: String
                  StringValue.$: $.notif.zona
                severidad:
                  DataType: String
                  StringValue.$: $.notif.severidad
            ResultSelector:
              rol: gerente
              MessageId.$: $.MessageId
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                Next: SinCorreoGerente
            End: true
          SinCorreoGerente:
            Type: Pass
            Result:
              rol: gerente
              enviado: false
            End: true
    Next: TieneTecnico

  TieneTecnico:
    Type: Choice
    Comment: Sin técnico disponible no tiene sentido esperar el SLA; se escala de inmediato
    Choices:
      - Or:
          - Variable: $.tecnico.tecnico_id
            IsPresent: false
          - Variable: $.tecnico.tecnico_id
            IsNull: true
        Next: Escalar
    Default: EsperarSLA

  EsperarSLA:
    Type: Wait
    Comment: Esperar no consume transiciones ni cómputo
    SecondsPath: $.control.sla_seg
    Next: VerificarAtencion

  VerificarAtencion:
    Type: Task
    Resource: arn:aws:states:::dynamodb:getItem
    Parameters:
      TableName: af_incidentes
      Key:
        incidente_id:
          S.$: $.incidente_id
    ResultSelector:
      estado.$: $.Item.estado.S
      severidad.$: $.Item.severidad.S
    ResultPath: $.actual
    Retry:
      - ErrorEquals: [States.TaskFailed]
        IntervalSeconds: 2
        MaxAttempts: 2
        BackoffRate: 2
    Catch:
      - ErrorEquals: [States.ALL]
        ResultPath: $.error
        Next: AvisarFallo
    Next: FueAtendido

  FueAtendido:
    Type: Choice
    Choices:
      - Or:
          - Variable: $.actual.estado
            StringEquals: en_atencion
          - Variable: $.actual.estado
            StringEquals: resuelto
        Next: Atendido
      - Variable: $.control.nivel
        NumericGreaterThanEquals: 2
        Next: EscaladoAGerencia
    Default: Escalar

  Escalar:
    Type: Task
    Comment: Nivel 1 -> supervisor, nivel 2 -> gerente. Si la severidad subió, el SLA se acorta.
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: ${self:custom.lambdaB}-operaciones
      Payload:
        accion: escalar
        incidente_id.$: $.incidente_id
        control.$: $.control
    ResultSelector:
      nivel.$: $.Payload.nivel
      sla_seg.$: $.Payload.sla_seg
      ruta.$: $.Payload.ruta
    ResultPath: $.control
    Retry:
      - ErrorEquals: [Lambda.TooManyRequestsException]
        IntervalSeconds: 2
        MaxAttempts: 8
        BackoffRate: 1.5
        JitterStrategy: FULL
      - ErrorEquals: [States.ALL]
        IntervalSeconds: 2
        MaxAttempts: 2
        BackoffRate: 2
    Catch:
      - ErrorEquals: [States.ALL]
        ResultPath: $.error
        Next: AvisarFallo
    Next: EsperarSLA

  Atendido:
    Type: Succeed

  EscaladoAGerencia:
    Type: Succeed
    Comment: Se avisó al supervisor y al gerente; el incidente sigue abierto en la cola

  AvisarFallo:
    Type: Task
    Comment: Integración directa con SNS (sin Lambda); el tópico se referencia por nombre fijo
    Resource: arn:aws:states:::sns:publish
    Parameters:
      TopicArn: arn:aws:sns:${aws:region}:${aws:accountId}:af-notif-supervisor
      Subject: "[ArquiFusion] Falla en el flujo de un incidente"
      Message.$: States.Format('El flujo del incidente {} se detuvo. Revise la consola de Step Functions. Detalle {}', $.incidente_id, States.JsonToString($.error))
    Next: FlujoFallido

  FlujoFallido:
    Type: Fail
    Error: FlujoIncidenteFallido
    Cause: Ver AvisarFallo y el historial de la ejecución
